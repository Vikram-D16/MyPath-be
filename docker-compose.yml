version: "3.8"

services:
  db:
    image: postgres
    container_name: mypath-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: mydb
      DATABASE_URL: postgres://postgres:yourpassword@db:5432/mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  # backend:
  #   build:
  #     context: .
  #   container_name: mypath-backend
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - db
  #   environment:
  #     DATABASE_URL: postgres://postgres:yourpassword@db:5432/mydb
  #   restart: always

volumes:
  db_data:
